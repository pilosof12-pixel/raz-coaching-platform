<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>RAZ — Program Pass QA Issuer</title>
  <style>
    :root{--bg:#080909;--panel:#121414;--line:#2a3030;--teal:#18d3c5;--text:#f4f5f5;--muted:#b8c0c0;--red:#ff6767;--ok:#66e38a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:650px;margin:auto;padding:28px 18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}h1{margin-top:6px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:800}.muted{color:var(--muted);font-size:13px;line-height:1.5}label{display:block;margin:18px 0 7px;font-size:13px;font-weight:700}input,select{width:100%;background:#181b1b;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-size:16px}button{margin-top:14px;width:100%;background:var(--teal);color:#04211f;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:800}.status{margin-top:14px;font-size:13px;color:var(--muted)}.err{color:var(--red)}.ok{color:var(--ok)}code{display:block;margin-top:14px;padding:12px;background:#181b1b;border:1px solid var(--line);border-radius:10px;color:var(--teal);word-break:break-all}.hidden{display:none}.warn{margin-top:14px;padding:11px;border:1px solid rgba(255,190,70,.4);border-radius:10px;color:#ffe4a8;font-size:12px}
  </style>
</head>
<body>
  <main class="wrap"><section class="card">
    <div class="eyebrow">Internal QA only</div>
    <h1>Issue Program Pass</h1>
    <p class="muted">The provisioning key stays in this browser session only and is sent directly to the protected server endpoint. It is never embedded in this page.</p>
    <div class="warn">Treat the issued Program Pass like a credential until it has been consumed by the intended QA run.</div>
    <label for="admin-key">ADMIN_PROVISION_KEY</label>
    <input id="admin-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste provisioning key" />
    <label for="count">Number of test passes</label>
    <select id="count"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
    <button id="issue" type="button">Issue test pass</button>
    <div id="status" class="status"></div>
    <div id="codes" class="hidden"></div>
  </section></main>
  <script src="program-pass-admin.js"></script>
</body>
</html>
