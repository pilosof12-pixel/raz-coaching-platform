<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RAZ Live Tactical QA</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:0 auto;padding:24px;background:#0b1324;color:#eef3fb}
    .card{background:#16213a;border-radius:16px;padding:20px;margin-top:18px}
    input,button,textarea{font:inherit} input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #52617d;background:#0f1930;color:#fff}
    button{margin-top:12px;padding:13px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55}.muted{color:#aebbd3}.ok{color:#94e2b3}.err{color:#ff9b9b}pre{white-space:pre-wrap;word-break:break-word;background:#0f1930;padding:14px;border-radius:10px;max-height:55vh;overflow:auto}
  </style>
</head>
<body>
  <h1>RAZ Live Tactical Acceptance</h1>
  <p class="muted">This launches the permanent Tactical 3K acceptance avatar through the deployed Program Pass and production generation path. The pass is entered only in this browser and is not embedded in this page.</p>
  <div class="card">
    <label for="pass">Unused Program Pass</label>
    <input id="pass" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="32-character pass">
    <button id="run" type="button">Run live Tactical build</button>
    <p id="status" class="muted">Loading launcher...</p>
  </div>
  <div id="result" class="card" hidden>
    <h2>Live result</h2>
    <p><strong>Personal code:</strong> <code id="token"></code></p>
    <p><strong>Job:</strong> <span id="job"></span></p>
    <pre id="program"></pre>
  </div>
  <script src="/live-tactical-qa.js" defer></script>
</body>
</html>
