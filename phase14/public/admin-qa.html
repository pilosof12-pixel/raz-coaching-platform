<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAZ QA Review</title><style>body{font-family:Arial,sans-serif;background:#0b0d0d;color:#eef3f2;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button{padding:10px;border-radius:8px;border:1px solid #33403f;background:#151919;color:#fff}button{background:#18d3c5;color:#04211f;font-weight:700;cursor:pointer}.muted{color:#9fb0ad}.card{border:1px solid #283130;background:#121515;border-radius:12px;padding:16px;margin:14px 0}.meta{display:flex;gap:14px;flex-wrap:wrap;color:#9fb0ad;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090b0b;padding:12px;border-radius:8px;max-height:520px;overflow:auto}details{margin-top:10px}h1{color:#18d3c5}</style></head><body><div class="wrap"><h1>RAZ Performance QA Review</h1><p class="muted">Private internal view for periodic coaching-quality review. The admin key stays in this browser session and is sent only as an authorization header.</p><div class="top"><input id="key" type="password" placeholder="ADMIN_QA_KEY" autocomplete="off"><button id="load">Load recent programs</button><span id="status" class="muted"></span></div><div id="list"></div></div><script>
const key=document.getElementById('key'),list=document.getElementById('list'),status=document.getElementById('status');
key.value=sessionStorage.getItem('raz_admin_key')||'';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){const k=key.value.trim();if(!k){status.textContent='Enter admin key';return;}sessionStorage.setItem('raz_admin_key',k);status.textContent='Loading…';list.innerHTML='';try{const r=await fetch('/api/admin/qa/recent?limit=40',{headers:{Authorization:'Bearer '+k}});const d=await r.json();if(!r.ok)throw new Error(d.error||('HTTP '+r.status));status.textContent=d.count+' programs';for(const c of d.clients){const primary=Array.isArray(c.intake?.primary_goals)?c.intake.primary_goals.join(' | '):(c.intake?.primary_goals||c.intake?.goal_primary||'');const sport=c.intake?.sport||'';const div=document.createElement('div');div.className='card';div.innerHTML='<div><strong>'+esc(c.client_code)+'</strong></div><div class="meta"><span>Updated: '+esc(c.updated_at)+'</span><span>Sport: '+esc(sport)+'</span></div><p><strong>Primary:</strong> '+esc(primary)+'</p><details><summary>Intake</summary><pre>'+esc(JSON.stringify(c.intake,null,2))+'</pre></details><details><summary>Program</summary><pre>'+esc(c.program)+'</pre></details>';list.appendChild(div);}}catch(e){status.textContent='Error: '+e.message;}}
document.getElementById('load').addEventListener('click',load);
</script></body></html>
