name: Diagnose root npm test once

on:
  push:
    branches:
      - privacy-security-hardening
    paths:
      - qa/diagnose-npm-test-trigger.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Capture exact npm test failure
        shell: bash
        run: |
          set +e
          npm test > /tmp/npm-test-diagnostic.txt 2>&1
          code=$?
          set -e
          mkdir -p qa
          {
            echo "exit_code=$code"
            echo "head_sha=$(git rev-parse HEAD)"
            cat /tmp/npm-test-diagnostic.txt
          } > qa/npm-test-diagnostic.txt
      - name: Commit diagnostic output
        run: |
          git config user.name 'RAZ regression bot'
          git config user.email 'actions@users.noreply.github.com'
          git add qa/npm-test-diagnostic.txt
          git commit -m 'Capture root npm test diagnostic' || true
          git push origin HEAD:privacy-security-hardening
