name: Phase 15 OpenAI Raz Benchmark

on:
  push:
    paths:
      - '.github/phase15-live-benchmark-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify generated Phase 15 runtime
        run: |
          cd phase14
          node --test test/phase15_planner_regression.test.mjs
          node scripts/build_phase15_runtime.mjs
          node --check server.phase15.js
          node --check engine/phase15_planner.js
          node --check engine/phase15_program_qa.js
          node --check engine/phase15_quality_rules.js
          node - <<'NODE'
          const fs = require('fs');
          const runtime = fs.readFileSync('server.phase15.js', 'utf8');
          if (runtime.includes('instructions: ENGINE')) throw new Error('Legacy oversized OpenAI instructions field still present');
          if (runtime.includes('ENGINE.slice(')) throw new Error('Legacy giant-engine chunk path still present');
          if (!runtime.includes('buildDeterministicBrief')) throw new Error('Deterministic planner missing from runtime');
          if (!runtime.includes('execution_path: "deterministic-skeleton-v3"')) throw new Error('Deterministic skeleton v3 telemetry missing');
          if (!runtime.includes('normalizeOpenAIExerciseNames')) throw new Error('OpenAI canonical-name repair missing');
          if (!runtime.includes('fast new-client intake persist')) throw new Error('New-client storage fast path missing');
          if (!runtime.includes('OPENAI_API_KEY ? 1 : 3')) throw new Error('Single-pass OpenAI attempt budget missing');
          console.log(JSON.stringify({execution_path:'deterministic-skeleton-v3', giant_engine_sent:false, single_paid_pass:true, new_client_fast_path:true}));
          NODE
      - name: Run OpenAI live benchmark
        env:
          BASE_URL: https://raz-coaching-platform.onrender.com
        run: node .github/phase15-live-benchmark.mjs
      - name: Commit benchmark result
        if: always()
        run: |
          git config user.name 'RAZ benchmark bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main || true
          git add .github/phase15-live-benchmark-result.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record OpenAI Phase 15 benchmark result'
          git push
