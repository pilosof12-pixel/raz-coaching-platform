name: Apply quality-preserving generation optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-quality-preserving-generation-optimization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: phase14/package-lock.json
      - name: Wire optimization into every production build
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('phase14/package.json')
          data=json.loads(p.read_text())
          cmd=data['scripts']['phase15:build']
          addon='node scripts/apply_quality_preserving_runtime_optimizations.mjs'
          if addon not in cmd:
              data['scripts']['phase15:build']=cmd+' && '+addon
          check=data['scripts']['check']
          syntax='node --check scripts/apply_quality_preserving_runtime_optimizations.mjs'
          if syntax not in check:
              data['scripts']['check']=check+' && '+syntax
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False)+'\n')
          PY
      - name: Install dependencies
        working-directory: phase14
        run: npm ci
      - name: Build exact production runtime with optimization
        working-directory: phase14
        run: npm run phase15:build
      - name: Focused quality-preserving regressions
        working-directory: phase14
        run: |
          node --check engine/quality_preserving_fast_repairs.js
          node --check scripts/apply_quality_preserving_runtime_optimizations.mjs
          node --check server.phase15.js
          node --check storage.js
          node --test test/quality_preserving_fast_repairs.test.js
          node --test test/v35_precredit_adversarial_audit.test.js
          node --test test/v35_per_set_note_repair.test.js
          node --test --test-name-pattern='G2-(1|2|3|4|5|6|7|8|9|14|15|16)|special-operations-style' test/coaching_spec_v1_live_convergence.test.js
          node --test --test-name-pattern='R(4|5|6|7|8|9|10|11|12|14)' test/v35_review_regressions.test.js
      - name: Assert no generation-quality downgrade
        working-directory: phase14
        run: |
          grep -q 'OPENAI_REASONING_EFFORT || "high"' server.phase15.js
          grep -q 'OPENAI_MAX_OUTPUT_TOKENS || 32000' server.phase15.js
          grep -q 'QUALITY-PRESERVING-FAST-REPAIR-WIRED' server.phase15.js
          grep -q 'DETERMINISTIC_NOTE_REPAIR' server.phase15.js
          grep -q 'SUPABASE-LEGACY-JOB-SCHEMA-COMPAT' storage.js
      - name: Commit production optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase14/package.json phase14/server.phase15.js phase14/storage.js phase14/engine/quality_preserving_fast_repairs.js phase14/scripts/apply_quality_preserving_runtime_optimizations.mjs phase14/test/quality_preserving_fast_repairs.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Optimize QA repairs without reducing generation quality [skip ci]'
          git push origin HEAD:privacy-security-hardening
