name: Apply Product Polish

on:
  push:
    paths:
      - 'phase14/scripts/apply_product_polish.mjs'
      - '.github/workflows/product-polish-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic product polish
        run: node phase14/scripts/apply_product_polish.mjs
      - name: Syntax checks
        run: |
          node --check phase14/server.js
          node --check phase14/storage.js
          node --check phase14/admin_qa_routes.js
          node --check phase14/public/spreadsheet.js
          node --check phase14/scripts/build_phase15_runtime.mjs
      - name: Commit patched product files
        run: |
          git config user.name 'RAZ product polish bot'
          git config user.email 'actions@users.noreply.github.com'
          git add phase14/server.js phase14/public/spreadsheet.js phase14/public/index.html phase14/scripts/build_phase15_runtime.mjs .github/workflows/phase15-static-qa.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Product: apply final privacy spreadsheet latency and QA polish'
          git pull --rebase origin main || true
          git push
