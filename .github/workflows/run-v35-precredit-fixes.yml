name: Run v35 pre-credit quality-floor verification

on:
  push:
    branches:
      - privacy-security-hardening
    paths:
      - 'phase14/engine/final_note_coherence.js'
      - 'phase14/engine/v34_prescription_consistency.js'
      - 'phase14/engine/manual_acceptance_quality.js'
      - 'phase14/engine/coaching_spec_v1_quality.js'
      - 'phase14/test/v35_precredit_adversarial_audit.test.js'
      - '.github/workflows/run-v35-precredit-fixes.yml'
  pull_request:
    branches:
      - privacy-security-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: phase14/package-lock.json
      - name: Apply one-shot pre-credit hardening
        run: python phase14/scripts/apply_v35_generation_spreadsheet_hardening.py
      - name: Install dependencies
        working-directory: phase14
        run: npm ci
      - name: Rebuild generated runtime
        working-directory: phase14
        run: node scripts/build_phase15_runtime.mjs
      - name: Syntax check
        working-directory: phase14
        run: |
          node --check scripts/build_phase15_runtime.mjs
          node --check server.phase15.js
          node --check public/spreadsheet-parity.js
          node --check engine/final_note_coherence.js
          node --check engine/v34_prescription_consistency.js
          node --check engine/manual_acceptance_quality.js
          node --check engine/coaching_spec_v1_quality.js
      - name: Run approved spreadsheet parity gate
        working-directory: phase14
        run: node --test test/spreadsheet_approved_parity.test.js
      - name: Run adversarial gate
        working-directory: phase14
        run: node --test test/v35_precredit_adversarial_audit.test.js
      - name: Run per-set regression
        working-directory: phase14
        run: node --test test/v35_per_set_note_repair.test.js
      - name: Run Tactical cross-week regression slice
        working-directory: phase14
        run: node --test --test-name-pattern='G2-(1|2|3|4|5|6|7|8|9|14|15|16)|special-operations-style' test/coaching_spec_v1_live_convergence.test.js
      - name: Run V35 contradiction slice
        working-directory: phase14
        run: node --test --test-name-pattern='R(4|5|6|7|8|9|10|11|12|14)' test/v35_review_regressions.test.js
      - name: Verify generated model-quality settings
        working-directory: phase14
        run: |
          grep -F 'OPENAI_REASONING_EFFORT || "high"' server.phase15.js
          grep -F 'OPENAI_MAX_OUTPUT_TOKENS || 24000' server.phase15.js
          grep -F 'OPENAI_API_KEY ? 2 : 3' server.phase15.js
          grep -F 'SILENT FINAL AUDIT BEFORE OUTPUT' server.phase15.js
      - name: Commit verified hardening and clean temporary scaffolding
        shell: bash
        run: |
          cat > .github/workflows/run-v35-precredit-fixes.yml <<'YAML'
          name: Run v35 pre-credit quality-floor verification

          on:
            push:
              branches:
                - privacy-security-hardening
              paths:
                - 'phase14/engine/final_note_coherence.js'
                - 'phase14/engine/v34_prescription_consistency.js'
                - 'phase14/engine/manual_acceptance_quality.js'
                - 'phase14/engine/coaching_spec_v1_quality.js'
                - 'phase14/test/v35_precredit_adversarial_audit.test.js'
                - '.github/workflows/run-v35-precredit-fixes.yml'
            pull_request:
              branches:
                - privacy-security-hardening
            workflow_dispatch:

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: npm
                    cache-dependency-path: phase14/package-lock.json
                - name: Install dependencies
                  working-directory: phase14
                  run: npm ci
                - name: Syntax check
                  working-directory: phase14
                  run: |
                    node --check engine/final_note_coherence.js
                    node --check engine/v34_prescription_consistency.js
                    node --check engine/manual_acceptance_quality.js
                    node --check engine/coaching_spec_v1_quality.js
                - name: Run adversarial gate
                  working-directory: phase14
                  run: node --test test/v35_precredit_adversarial_audit.test.js
                - name: Run per-set regression
                  working-directory: phase14
                  run: node --test test/v35_per_set_note_repair.test.js
                - name: Run Tactical cross-week regression slice
                  working-directory: phase14
                  run: node --test --test-name-pattern='G2-(1|2|3|4|5|6|7|8|9|14|15|16)|special-operations-style' test/coaching_spec_v1_live_convergence.test.js
                - name: Run V35 contradiction slice
                  working-directory: phase14
                  run: node --test --test-name-pattern='R(4|5|6|7|8|9|10|11|12|14)' test/v35_review_regressions.test.js
          YAML
          rm -f phase14/scripts/apply_v35_generation_spreadsheet_hardening.py
          rm -f .github/workflows/apply-v35-generation-spreadsheet-hardening.yml
          rm -f .github/v35-generation-sheet-trigger.txt
          rm -f .github/v35-generation-sheet-pr-trigger.txt
          rm -f .github/v35-generation-sheet-pr-trigger-branch.txt
          rm -f .github/v35-generation-sheet-trigger-final.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Maximise generation quality and lock approved spreadsheet parity [skip ci]'
          git push origin HEAD:privacy-security-hardening
