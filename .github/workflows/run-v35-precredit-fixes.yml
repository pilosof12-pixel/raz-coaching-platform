name: Run v35 pre-credit quality-floor verification

on:
  push:
    branches:
      - privacy-security-hardening
    paths:
      - 'phase14/engine/final_note_coherence.js'
      - 'phase14/engine/v34_prescription_consistency.js'
      - 'phase14/engine/manual_acceptance_quality.js'
      - 'phase14/engine/coaching_spec_v1_quality.js'
      - 'phase14/test/v35_precredit_adversarial_audit.test.js'
      - '.github/workflows/run-v35-precredit-fixes.yml'
  pull_request:
    branches:
      - privacy-security-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: phase14/package-lock.json
      - name: Restore builder anchor for final four-pass repair architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phase14/scripts/build_phase15_runtime.mjs')
          s=p.read_text()
          old='const MAX_ATTEMPTS = OPENAI_API_KEY ? 2 : 3;'
          new='const MAX_ATTEMPTS = OPENAI_API_KEY ? 1 : 3;'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('OpenAI repair-budget builder anchor missing')
          p.write_text(s)
          PY
      - name: Install dependencies
        working-directory: phase14
        run: npm ci
      - name: Run exact production phase15 build chain
        working-directory: phase14
        run: npm run phase15:build
      - name: Verify final runtime architecture and spreadsheet parity
        working-directory: phase14
        run: |
          node --check server.phase15.js
          node --check public/spreadsheet-parity.js
          grep -F 'OPENAI_REASONING_EFFORT || "high"' server.phase15.js
          grep -F 'OPENAI_MAX_OUTPUT_TOKENS || 24000' server.phase15.js
          grep -F 'const MAX_ATTEMPTS = 4; // INTERNAL-QA-REPAIR-BUDGET' server.phase15.js
          grep -F 'SILENT FINAL AUDIT BEFORE OUTPUT' server.phase15.js
          node --test test/spreadsheet_approved_parity.test.js
          node --test test/v35_precredit_adversarial_audit.test.js
          node --test test/v35_per_set_note_repair.test.js
          node --test --test-name-pattern='G2-(1|2|3|4|5|6|7|8|9|14|15|16)|special-operations-style' test/coaching_spec_v1_live_convergence.test.js
          node --test --test-name-pattern='R(4|5|6|7|8|9|10|11|12|14)' test/v35_review_regressions.test.js
      - name: Commit build-stable quality configuration
        shell: bash
        run: |
          cat > .github/workflows/run-v35-precredit-fixes.yml <<'YAML'
          name: Run v35 pre-credit quality-floor verification

          on:
            push:
              branches:
                - privacy-security-hardening
              paths:
                - 'phase14/engine/final_note_coherence.js'
                - 'phase14/engine/v34_prescription_consistency.js'
                - 'phase14/engine/manual_acceptance_quality.js'
                - 'phase14/engine/coaching_spec_v1_quality.js'
                - 'phase14/test/v35_precredit_adversarial_audit.test.js'
                - '.github/workflows/run-v35-precredit-fixes.yml'
            pull_request:
              branches:
                - privacy-security-hardening
            workflow_dispatch:

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: npm
                    cache-dependency-path: phase14/package-lock.json
                - name: Install dependencies
                  working-directory: phase14
                  run: npm ci
                - name: Syntax check
                  working-directory: phase14
                  run: |
                    node --check engine/final_note_coherence.js
                    node --check engine/v34_prescription_consistency.js
                    node --check engine/manual_acceptance_quality.js
                    node --check engine/coaching_spec_v1_quality.js
                - name: Run adversarial gate
                  working-directory: phase14
                  run: node --test test/v35_precredit_adversarial_audit.test.js
                - name: Run per-set regression
                  working-directory: phase14
                  run: node --test test/v35_per_set_note_repair.test.js
                - name: Run Tactical cross-week regression slice
                  working-directory: phase14
                  run: node --test --test-name-pattern='G2-(1|2|3|4|5|6|7|8|9|14|15|16)|special-operations-style' test/coaching_spec_v1_live_convergence.test.js
                - name: Run V35 contradiction slice
                  working-directory: phase14
                  run: node --test --test-name-pattern='R(4|5|6|7|8|9|10|11|12|14)' test/v35_review_regressions.test.js
          YAML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep high-reasoning generation compatible with four-pass QA repair [skip ci]'
          git push origin HEAD:privacy-security-hardening
