name: Phase 15 Static Coaching QA

on:
  push:
    paths:
      - 'phase14/engine/phase15_planner.js'
      - 'phase14/engine/phase15_specialist_rules.js'
      - 'phase14/engine/skill_progressions.js'
      - 'phase14/engine/phase15_program_qa.js'
      - 'phase14/engine/phase15_final_qa.js'
      - 'phase14/engine/phase15_quality_rules.js'
      - 'phase14/scripts/build_phase15_runtime.mjs'
      - 'phase14/test/phase15_planner_regression.test.mjs'
      - 'phase14/test/phase15_specialist_rules.test.mjs'
      - 'phase14/test/exercise_demo_coverage.test.mjs'
      - 'phase14/public/exerciseDemos.js'
      - 'phase14/data/lib/exerciseDemos.js'
      - 'phase14/data/exercise_demos.json'
      - '.github/workflows/phase15-static-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: qa
        name: Run deterministic coaching regressions
        continue-on-error: true
        run: |
          set +e
          cd phase14
          : > ../.github/phase15-static-qa-log.txt
          failed=0
          runcheck() {
            label="$1"; shift
            echo "===== $label =====" | tee -a ../.github/phase15-static-qa-log.txt
            "$@" >> ../.github/phase15-static-qa-log.txt 2>&1
            code=$?
            echo "EXIT=$code" | tee -a ../.github/phase15-static-qa-log.txt
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          runcheck planner_regression node --test test/phase15_planner_regression.test.mjs
          runcheck specialist_rules node --test test/phase15_specialist_rules.test.mjs
          if [ -f test/exercise_demo_coverage.test.mjs ]; then runcheck demo_coverage node --test test/exercise_demo_coverage.test.mjs; fi
          runcheck build_runtime node scripts/build_phase15_runtime.mjs
          runcheck syntax_runtime node --check server.phase15.js
          runcheck syntax_planner node --check engine/phase15_planner.js
          runcheck syntax_specialist node --check engine/phase15_specialist_rules.js
          runcheck syntax_program_qa node --check engine/phase15_program_qa.js
          runcheck syntax_final_qa node --check engine/phase15_final_qa.js
          runcheck syntax_quality node --check engine/phase15_quality_rules.js
          runcheck grep_v4 grep -q 'deterministic-skeleton-v4' server.phase15.js
          runcheck grep_final_qa grep -q 'validatePhase15FinalProgram' server.phase15.js
          runcheck grep_direct_skill_protection grep -q 'if (!OPENAI_API_KEY)' server.phase15.js
          runcheck grep_normalizer grep -q 'normalizeOpenAIExerciseNames' server.phase15.js
          runcheck grep_fast_path grep -q 'fast new-client intake persist' server.phase15.js
          runcheck grep_specialist grep -q 'buildSpecialistRules' engine/phase15_planner.js
          exit "$failed"
      - name: Write static QA result
        if: always()
        env:
          QA_OUTCOME: ${{ steps.qa.outcome }}
          SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('.github/phase15-static-qa-result.json', JSON.stringify({
            timestamp:new Date().toISOString(),
            tested_sha:process.env.SHA,
            outcome:process.env.QA_OUTCOME,
            ok:process.env.QA_OUTCOME==='success'
          },null,2));
          NODE
      - name: Commit static QA result
        if: always()
        run: |
          git config user.name 'RAZ static QA bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main || true
          git add .github/phase15-static-qa-result.json .github/phase15-static-qa-log.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Phase 15 static QA result'
          git push
      - name: Fail if QA failed
        if: steps.qa.outcome != 'success'
        run: exit 1
