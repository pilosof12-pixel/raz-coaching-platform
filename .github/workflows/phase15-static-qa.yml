name: Phase 15 Static Coaching QA

on:
  push:
    paths:
      - 'phase14/engine/phase15_planner.js'
      - 'phase14/engine/phase15_specialist_rules.js'
      - 'phase14/engine/skill_progressions.js'
      - 'phase14/engine/phase15_program_qa.js'
      - 'phase14/engine/phase15_quality_rules.js'
      - 'phase14/scripts/build_phase15_runtime.mjs'
      - 'phase14/test/phase15_planner_regression.test.mjs'
      - 'phase14/test/phase15_specialist_rules.test.mjs'
      - 'phase14/test/exercise_demo_coverage.test.mjs'
      - 'phase14/public/exerciseDemos.js'
      - 'phase14/data/lib/exerciseDemos.js'
      - 'phase14/data/exercise_demos.json'
      - '.github/workflows/phase15-static-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: qa
        name: Run deterministic coaching regressions
        continue-on-error: true
        run: |
          set -e
          cd phase14
          node --test test/phase15_planner_regression.test.mjs
          node --test test/phase15_specialist_rules.test.mjs
          if [ -f test/exercise_demo_coverage.test.mjs ]; then node --test test/exercise_demo_coverage.test.mjs; fi
          node scripts/build_phase15_runtime.mjs
          node --check server.phase15.js
          node --check engine/phase15_planner.js
          node --check engine/phase15_specialist_rules.js
          node --check engine/phase15_program_qa.js
          node --check engine/phase15_quality_rules.js
          grep -q 'deterministic-skeleton-v3' server.phase15.js
          grep -q 'normalizeOpenAIExerciseNames' server.phase15.js
          grep -q 'fast new-client intake persist' server.phase15.js
          grep -q 'buildSpecialistRules' engine/phase15_planner.js
      - name: Write static QA result
        if: always()
        env:
          QA_OUTCOME: ${{ steps.qa.outcome }}
          SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('.github/phase15-static-qa-result.json', JSON.stringify({
            timestamp:new Date().toISOString(),
            tested_sha:process.env.SHA,
            outcome:process.env.QA_OUTCOME,
            ok:process.env.QA_OUTCOME==='success'
          },null,2));
          NODE
      - name: Commit static QA result
        if: always()
        run: |
          git config user.name 'RAZ static QA bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main || true
          git add .github/phase15-static-qa-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Phase 15 static QA result'
          git push
      - name: Fail if QA failed
        if: steps.qa.outcome != 'success'
        run: exit 1
