name: Final unresolved live coaching acceptance

on:
  push:
    branches:
      - privacy-security-hardening
    paths:
      - qa/live-final-trigger.txt

permissions:
  contents: read

jobs:
  live-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare final-two acceptance script
        run: |
          python - <<'PY'
          p='scripts/live_final_six_acceptance.mjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("const ambiguous={primary_goals:", "const ambiguous={experience:'advanced',primary_goals:", 1)
          keep={'AVATAR3_WARRIOR','ANNOYING_CONCURRENT'}
          lines=[]
          for line in s.splitlines():
              if line.startswith("results.push(await runCase('"):
                  name=line.split("results.push(await runCase('",1)[1].split("'",1)[0]
                  if name not in keep:
                      continue
              lines.append(line)
          open('scripts/live_final_two.mjs','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          print('cases',sorted(keep))
          PY
      - name: Wait for Render deployment
        run: sleep 240
      - name: Run final two live cases
        run: node scripts/live_final_two.mjs
