name: Apply v34 coaching architecture

on:
  push:
    branches:
      - main
      - privacy-security-hardening
  pull_request:
    branches:
      - privacy-security-hardening

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
          fetch-depth: 0
      - name: Check readiness
        id: ready
        shell: bash
        run: |
          if [ -f .github/v34-patch/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact v34 patch and test
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v34-patch/chunk*.b64 | tr -d '\n' | base64 -d > /tmp/v34.patch
          echo "9c0bacf4023f4a37cd165b124ddfb420302e6108c932c2145e941ee6d129fd30  /tmp/v34.patch" | sha256sum -c -
          git apply --check /tmp/v34.patch
          git apply /tmp/v34.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('phase14/engine/phase15_planner.js')
          s=p.read_text()
          a="  const readinessRanked = gymDayReadiness(intake, { gymDays: days }).days.map(x => x.day);\n  const cleanDays = readinessRanked.filter(d => days.includes(d));"
          b="  const readinessScores = gymDayReadiness(intake, { gymDays: days }).days;\n  const readinessRanked = readinessScores.map(x => x.day);\n  const cleanDays = readinessRanked.filter(d => days.includes(d));"
          if a not in s: raise SystemExit('readiness anchor missing')
          s=s.replace(a,b,1)
          a2="  if (oapGoal && oap!=null && oap>=2 && cleanDays.length) { const d=cleanDays[0]; for (const x of days) sessions[x]=sessions[x].filter(v=>v!=='OAP_STRICT'); sessions[d].unshift('OAP_STRICT'); }"
          b2="""  if (oapGoal && oap!=null && oap>=2 && cleanDays.length) {
    const current = days.find(x => sessions[x].includes('OAP_STRICT'));
    const best = readinessScores.find(x => x.day === cleanDays[0]);
    const currentScore = readinessScores.find(x => x.day === current);
    const shouldMove = !current || !currentScore || !best || (best.score - currentScore.score >= 1);
    if (shouldMove) {
      const d = cleanDays[0];
      for (const x of days) sessions[x]=sessions[x].filter(v=>v!=='OAP_STRICT');
      sessions[d].unshift('OAP_STRICT');
    }
  }"""
          if a2 not in s: raise SystemExit('OAP placement anchor missing')
          p.write_text(s.replace(a2,b2,1))
          PY
          npm ci --ignore-scripts
          (cd phase14 && node --test test/v34_coaching_architecture.test.js)
          (cd phase14 && node --check engine/phase15_planner.js && node --check engine/phase15_quality_rules.js && node --check engine/repairable_validation_bundle.js && node --check engine/v34_coaching_architecture.js && node --check engine/v34_prescription_consistency.js && node --check engine/v34_readiness.js && node --check engine/v34_workload_accounting.js)
          (cd phase14 && node --test test/*.test.js)
      - name: Commit v34
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/v34-patch .github/workflows/apply-v34-coaching.yml .github/workflows/apply-v33-final-coaching-coherence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply v34 coaching architecture refinement"
          git push origin HEAD:privacy-security-hardening
