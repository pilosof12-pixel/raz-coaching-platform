name: Apply v33 final coaching coherence

on:
  push:
    branches:
      - privacy-security-hardening
  pull_request:
    branches:
      - privacy-security-hardening

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
          fetch-depth: 0
      - name: Check readiness
        id: ready
        shell: bash
        run: |
          if [ -f .v33-patch/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Apply patch and test
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .v33-patch/chunk*.b64 | tr -d '\n' | base64 -d > /tmp/v33.patch
          git apply --check /tmp/v33.patch
          git apply /tmp/v33.patch
          mkdir -p docs/qa/live-three-avatar/latest
          cp docs/qa/live-three-avatar/advanced_hybrid-program.txt docs/qa/live-three-avatar/latest/advanced_hybrid-program.txt
          cp docs/qa/live-three-avatar/youth_gymnastics-program.txt docs/qa/live-three-avatar/latest/youth_gymnastics-program.txt
          cp docs/qa/live-three-avatar/tactical_3k-program.txt docs/qa/live-three-avatar/latest/tactical_3k-program.txt
          npm ci
          node --test phase14/test/final_coaching_coherence_v33.test.js
          rm -f docs/qa/live-three-avatar/latest/advanced_hybrid-program.txt docs/qa/live-three-avatar/latest/youth_gymnastics-program.txt docs/qa/live-three-avatar/latest/tactical_3k-program.txt
      - name: Commit v33
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v33-patch .github/workflows/apply-v33-final-coaching-coherence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply v33 final coaching coherence"
          git push origin HEAD:privacy-security-hardening
