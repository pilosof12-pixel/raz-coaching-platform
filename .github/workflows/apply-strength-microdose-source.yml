name: Apply Strength Microdose Source

on:
  push:
    branches: [privacy-security-hardening]
    paths:
      - '.github/workflows/apply-strength-microdose-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source-authored microdose accounting patch
        run: node phase14/scripts/apply_strength_session_microdose_accounting.mjs
      - name: Run focused regression
        working-directory: phase14
        run: node --test test/strength_session_microdose_accounting.test.js
      - name: Commit patched live source
        run: |
          git config user.name 'RAZ QA patch bot'
          git config user.email 'actions@users.noreply.github.com'
          git add phase14/engine/phase15_elite_guardrails.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply high-concurrency strength microdose accounting'
          git push origin HEAD:privacy-security-hardening
