name: Claude Code Official

on:
  push:
    branches: [privacy-security-hardening]
    paths:
      - '.github/workflows/claude-official.yml'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude-response:
    runs-on: ubuntu-latest
    steps:
      - name: Claude Code Action Official
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ github.event_name == 'push' && 'Verification only: inspect the repository and reply with a short confirmation that Claude Code Action authenticated successfully. Do not modify files.' || '' }}
          additional_permissions: |
            actions: read
