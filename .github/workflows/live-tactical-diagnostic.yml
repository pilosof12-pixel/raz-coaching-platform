name: Live Tactical QA Diagnostic

on:
  push:
    paths:
      - '.github/workflows/live-tactical-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run controlled Tactical build with QA trace
        env:
          BASE_URL: https://raz-coaching-platform.onrender.com
          ADMIN_PROVISION_KEY: ${{ secrets.ADMIN_PROVISION_KEY }}
        run: |
          mkdir -p docs/qa/live-tactical
          node <<'NODE'
          import fs from 'node:fs';
          const base=process.env.BASE_URL;
          const adminKey=process.env.ADMIN_PROVISION_KEY||'';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const consent=()=>({health_data:true,policy_version:'2026-08-15',consented_at:new Date().toISOString()});
          if(!adminKey) throw new Error('ADMIN_PROVISION_KEY missing');
          const intake={
            age:27, language:'en', experience:'advanced',
            primary_goals:['Improve 3 km from 13:30 to sub-12:00'],
            secondary_goals:['Improve 10 km ruck with 20 kg from 95 min toward 82 min','Improve strict pull-ups from 14 toward 18-20'],
            maintenance_goals:['Maintain useful squat and deadlift strength while staying athletic and relatively weight-stable'],
            goal_priority_model:'tiered', days_per_week:3, session_duration_minutes:60,
            gym_availability_mode:'flexible', available_gym_days:[], training_location:'commercial_gym',
            equipment:'Full gym, track/road access, hills, pull-up bar, 20 kg ruck/backpack, 30 kg sandbag and sled.',
            current_numbers:['3 km: 13:30','10 km ruck with 20 kg: 95 min','Back Squat: 140 kg x 5','Deadlift: 180 kg x 3','Overhead Press: 65 kg x 5','Weighted Pull-up: +30 kg x 5','Strict Pull-ups: 14 reps','Push-ups: 55 clean reps in 2 min'].join('\n'),
            performance_markers:['3 km: 13:30','10 km ruck with 20 kg: 95 min'],
            injuries:'Previous shin-splint irritation with abrupt running-volume increases; currently asymptomatic.',
            pain:{active:false,description:'',severity:'',character:'',next_day_baseline:'normal',tolerated_movements:'Current 18-20 km/week running and one 8-10 km ruck with 20 kg are tolerated without symptoms.'},
            sport:'', sport_schedule:[], mobility:{active:false,limitation:''}, sleep_hours:'7-8', recovery_rating:'Good',
            notes:['Currently runs 3 sessions per week, about 18-20 km/week: one interval session, one easy run and one longer aerobic run.','Currently does 1 ruck per week, usually 8-10 km with 20 kg.','Recent 400 m repeats are around 1:42-1:45 with adequate recovery for repeatability.','Previous shin-splint irritation happened when running volume increased abruptly; currently asymptomatic at present running and ruck volume.','Can train across five calendar days and is comfortable combining compatible easy running or rucking with a strength day when sensible.','Wants combat-ready / special-operations-style fitness without random punishment circuits or unnecessary mass gain.'].join(' '),
            qa_diagnostics:true, privacy_consent:consent()
          };
          async function req(path,opt={}){const r=await fetch(base+path,opt);const text=await r.text();let j={};try{j=JSON.parse(text)}catch{};return {r,j,text};}
          const pass=await req('/api/admin/program-pass',{method:'POST',headers:{'content-type':'application/json','x-admin-provision-key':adminKey},body:JSON.stringify({count:1})});
          if(!pass.r.ok||!pass.j?.codes?.[0]) throw new Error('Pass provisioning failed');
          const build=await req('/api/build',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intake,pass_code:pass.j.codes[0]})});
          if(build.r.status!==202||!build.j?.job_id) throw new Error('Build not accepted: '+build.r.status+' '+build.text.slice(0,300));
          let job={};
          for(let i=0;i<210;i++){
            await sleep(2000);
            try{({j:job}=await req('/api/job/'+encodeURIComponent(build.j.job_id)));}catch{}
            if(job?.status==='done'||job?.status==='error') break;
          }
          const record={job_id:build.j.job_id,status:job?.status||'timeout',stage:job?.stage||null,attempt:job?.attempt||null,error:job?.error||null,program_chars:typeof job?.program==='string'?job.program.length:0};
          fs.writeFileSync('docs/qa/live-tactical/diagnostic.json',JSON.stringify(record,null,2));
          if(job?.status==='done'&&typeof job.program==='string') fs.writeFileSync('docs/qa/live-tactical/diagnostic-program.txt',job.program);
          console.log(JSON.stringify(record));
          NODE
      - name: Commit sanitized diagnostic
        if: always()
        run: |
          git config user.name 'RAZ live QA bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin privacy-security-hardening || true
          git add docs/qa/live-tactical/diagnostic.json docs/qa/live-tactical/diagnostic-program.txt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record live Tactical QA diagnostic'
          git push origin HEAD:privacy-security-hardening
