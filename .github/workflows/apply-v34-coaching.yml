name: Apply v34 coaching architecture

on:
  push:
    branches:
      - privacy-security-hardening
  pull_request:
    branches:
      - privacy-security-hardening

permissions:
  contents: write

jobs:
  apply-v34:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
          fetch-depth: 0

      - name: Check readiness
        id: ready
        shell: bash
        run: |
          if [ -f .github/v34-patch/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and verify uploaded patch
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v34-patch/chunk*.b64 | tr -d '\n' | base64 -d > /tmp/v34.patch
          sha256sum /tmp/v34.patch
          echo "9c0bacf4023f4a37cd165b124ddfb420302e6108c932c2145e941ee6d129fd30  /tmp/v34.patch" | sha256sum -c -
          git apply --check /tmp/v34.patch
          git apply /tmp/v34.patch

      - name: Apply final readiness mapping and release corrections
        if: steps.ready.outputs.ready == 'true'
        shell: python
        run: |
          from pathlib import Path

          p = Path('phase14/engine/phase15_planner.js')
          s = p.read_text()
          old = """  const readinessRanked = gymDayReadiness(intake, { gymDays: days }).days.map(x => x.day);\n  const cleanDays = readinessRanked.filter(d => days.includes(d));"""
          new = """  const readinessScores = gymDayReadiness(intake, { gymDays: days }).days;\n  // Preserve the legacy same-day clean list for existing placement rules. Readiness\n  // ranking is intentionally scoped only to the advanced OAP neural exposure.\n  const cleanDays = days.filter(d => !sport[d]);\n  const dayKeyOf = (label) => String(label || '').trim().slice(0, 3).toLowerCase();\n  const readinessScoreFor = (label) => readinessScores.find(x => x.day === dayKeyOf(label));\n  const readinessRanked = readinessScores.map(x => days.find(d => dayKeyOf(d) === x.day)).filter(Boolean);\n  const oapReadinessDays = readinessRanked;"""
          if old not in s:
              raise SystemExit('readiness ranking anchor not found')
          s = s.replace(old, new, 1)

          old2 = """  if (oapGoal && oap!=null && oap>=2 && cleanDays.length) { const d=cleanDays[0]; for (const x of days) sessions[x]=sessions[x].filter(v=>v!=='OAP_STRICT'); sessions[d].unshift('OAP_STRICT'); }"""
          new2 = """  if (oapGoal && oap!=null && oap>=2 && oapReadinessDays.length) {\n    const current = days.find(x => sessions[x].includes('OAP_STRICT'));\n    const best = readinessScoreFor(oapReadinessDays[0]);\n    const currentScore = readinessScoreFor(current);\n    const shouldMove = !current || !currentScore || !best || (best.score - currentScore.score >= 1);\n    if (shouldMove) {\n      const d = oapReadinessDays[0];\n      for (const x of days) sessions[x]=sessions[x].filter(v=>v!=='OAP_STRICT');\n      sessions[d].unshift('OAP_STRICT');\n    }\n  }"""
          if old2 not in s:
              raise SystemExit('OAP placement anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          sp = Path('phase14/engine/skill_progressions.js')
          ss = sp.read_text()
          equip_old = 'case "pull_up_bar": return /pull[-\\s]?up bar|chin[-\\s]?up bar|monkey bar|doorframe|door frame|calisthenics|outdoor[_\\s]?park|\\bpull[-\\s]?up\\b/.test(text);'
          equip_new = 'case "pull_up_bar": return /pull[-\\s]?up bar|chin[-\\s]?up bar|monkey bar|doorframe|door frame|calisthenics|outdoor[_\\s]?park|bodyweight station|\\bpull[-\\s]?up\\b/.test(text);'
          if equip_old not in ss:
              raise SystemExit('pull-up equipment inference anchor not found')
          sp.write_text(ss.replace(equip_old, equip_new, 1))

          # Loaded carries and rucks are distance/time locomotion, not barbell lifts.
          # Never manufacture kg x reps ramp sets for them.
          wu = Path('phase14/engine/specific_warmup_enrichment.js')
          ws = wu.read_text()
          ramp_anchor = "export function rampText(exercise, load) {\n"
          ramp_guard = "export function rampText(exercise, load) {\n  if (/backpack\\s+carry|ruck|loaded\\s+march|farmer(?:'s)?\\s+carry|suitcase\\s+carry/i.test(String(exercise || ''))) return '';\n"
          if ramp_anchor not in ws:
              raise SystemExit('warm-up ramp anchor not found')
          wu.write_text(ws.replace(ramp_anchor, ramp_guard, 1))

          # Validate ruck warm-up semantics against the raw machine block as well as
          # the parsed warm-up role so malformed kg x reps prose cannot slip through.
          tm = Path('phase14/engine/tactical_manual_acceptance.js')
          ms = tm.read_text()
          tactical_anchor = "export function validateTacticalManualAcceptanceSemantic(program, intake = {}, suppliedModel = null) {\n  if (!isTacticalIntake(intake)) return { ok: true, skipped: true };\n"
          tactical_guard = "export function validateTacticalManualAcceptanceSemantic(program, intake = {}, suppliedModel = null) {\n  if (!isTacticalIntake(intake)) return { ok: true, skipped: true };\n  const rawProgram = String(program || '');\n  if (/ramp\\s+(?:backpack\\s+carry|ruck|loaded\\s+march)[^\\n]*\\b\\d+(?:\\.\\d+)?\\s*kg\\s*x\\s*\\d/i.test(rawProgram)) {\n    fail('TACTICAL_RUCK_WARMUP_MISREPRESENTED', 'Ruck/backpack warm-ups must use walking and ankle/calf preparation or an easy first few minutes under the pack, not strength-style kg x reps ramps.');\n  }\n"
          if tactical_anchor not in ms:
              raise SystemExit('tactical warm-up validation anchor not found')
          tm.write_text(ms.replace(tactical_anchor, tactical_guard, 1))

          # The accepted Youth architecture uses these two explicit skill drills.
          # Keep the dictionary closed while recognizing those exact canonical names.
          ed = Path('phase14/engine/exercise_dictionary.js')
          es = ed.read_text()
          if '"Controlled Handstand Kick-up"' not in es:
              hand_anchor = '  "Handstand Hold", "Handstand Walk",\n'
              if hand_anchor not in es:
                  raise SystemExit('Youth handstand dictionary anchor not found')
              es = es.replace(hand_anchor, '  "Handstand Hold", "Handstand Walk", "Controlled Handstand Kick-up",\n', 1)
          if '"Bar Muscle-up Transition Drill"' not in es:
              mu_anchor = '  "Strict Chest-to-Bar Pull-up", "Explosive Hip-to-Bar Pull-up",\n'
              if mu_anchor not in es:
                  raise SystemExit('Youth muscle-up dictionary anchor not found')
              es = es.replace(mu_anchor, '  "Strict Chest-to-Bar Pull-up", "Explosive Hip-to-Bar Pull-up", "Bar Muscle-up Transition Drill",\n', 1)
          ed.write_text(es)

          # Restore Hebrew RTL behavior in the approved premium workbook without
          # changing the agreed sheet order or eleven-column weekly layout.
          sheet = Path('phase14/public/spreadsheet.js')
          xs = sheet.read_text()
          text_anchor = '  function setTextCell(cell,value){ cell.value=value==null?"":String(value); cell.numFmt="@"; return cell.value; }\n'
          text_new = '  function setTextCell(cell,value){ cell.value=value==null?"":String(value); cell.numFmt = "@"; return cell.value; }\n  function isHebrewProgram(text,intake){ return /[\\u0590-\\u05FF]/.test(String(text||"")+" "+JSON.stringify(intake||{})); }\n'
          if text_anchor not in xs:
              raise SystemExit('spreadsheet text-cell anchor not found')
          xs = xs.replace(text_anchor, text_new, 1)
          render_anchor = '    renderQa(wb.addWorksheet("QA Checklist"),weeks,text,intake);\n    const buffer=await wb.xlsx.writeBuffer();'
          render_new = '    renderQa(wb.addWorksheet("QA Checklist"),weeks,text,intake);\n    const isHebrew=isHebrewProgram(text,intake);\n    wb.worksheets.forEach(ws=>{ ws.views=(ws.views&&ws.views.length?ws.views:[{}]).map(v=>({...v, rightToLeft: isHebrew})); });\n    const buffer=await wb.xlsx.writeBuffer();'
          if render_anchor not in xs:
              raise SystemExit('spreadsheet workbook render anchor not found')
          sheet.write_text(xs.replace(render_anchor, render_new, 1))

          t = Path('phase14/test/v34_coaching_architecture.test.js')
          ts = t.read_text()
          marker = "// 4. Handstand reduced-support"
          extra = """const plannerIntake = (gymDays, sportSchedule) => ({\n  days_per_week: gymDays.length,\n  available_gym_days: gymDays,\n  primary_goals: ['4 One arm pullups'],\n  current_numbers: 'One-Arm Pull-up: 2 strict reps each arm',\n  sport_schedule: sportSchedule,\n});\nconst oapDay = (brief) => {\n  const line = brief.split('\\n').find((l) => /OAP_STRICT/.test(l));\n  return line ? line.trim().replace(/^\\*\\s*/, '').split(':')[0] : null;\n};\n\ntest('[V34-3c] readiness placement actually reaches the planner and honours hysteresis', async () => {\n  const { buildDeterministicBrief } = await import('../engine/phase15_planner.js');\n  const { gymDayReadiness } = await import('../engine/v34_readiness.js');\n\n  const better = plannerIntake(['Mon', 'Wed'], [{ day: 'Tue', intensity: 'hard' }]);\n  const betterScores = gymDayReadiness(better, { gymDays: ['Mon', 'Wed'] }).days;\n  assert.equal(betterScores[0].day, 'mon');\n  assert.ok(betterScores[0].score - betterScores[1].score >= 1);\n  assert.equal(oapDay(buildDeterministicBrief(better)), 'Mon');\n\n  const mirrored = plannerIntake(['Mon', 'Wed'], [{ day: 'Sun', intensity: 'hard' }]);\n  assert.equal(oapDay(buildDeterministicBrief(mirrored)), 'Wed');\n\n  const tied = plannerIntake(['Mon', 'Wed'], []);\n  const tiedScores = gymDayReadiness(tied, { gymDays: ['Mon', 'Wed'] }).days;\n  assert.equal(tiedScores[0].score - tiedScores[1].score, 0);\n  assert.equal(oapDay(buildDeterministicBrief(tied)), 'Wed');\n});\n\n"""
          if marker not in ts:
              raise SystemExit('test insertion marker not found')
          ts = ts.replace(marker, extra + marker, 1)
          t.write_text(ts)

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.ready.outputs.ready == 'true'
        run: npm ci

      - name: Run v34 and release-critical focused tests
        if: steps.ready.outputs.ready == 'true'
        working-directory: phase14
        run: node --test test/v34_coaching_architecture.test.js test/pre_live_roadmap_lingo_release.test.js test/tactical_manual_acceptance.test.js test/youth_skill_dictionary.test.js

      - name: Syntax check modified engine files
        if: steps.ready.outputs.ready == 'true'
        working-directory: phase14
        run: |
          node --check engine/phase15_planner.js
          node --check engine/phase15_quality_rules.js
          node --check engine/repairable_validation_bundle.js
          node --check engine/v34_coaching_architecture.js
          node --check engine/v34_prescription_consistency.js
          node --check engine/v34_readiness.js
          node --check engine/v34_workload_accounting.js
          node --check engine/skill_progressions.js
          node --check engine/specific_warmup_enrichment.js
          node --check engine/tactical_manual_acceptance.js
          node --check engine/exercise_dictionary.js
          node --check public/spreadsheet.js

      - name: Run regression tests
        if: steps.ready.outputs.ready == 'true'
        working-directory: phase14
        shell: bash
        run: |
          set +e
          node --test test/*.test.js 2>&1 | tee /tmp/v34-regression.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/v34-regression.log ../.github/v34-regression-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ../.github/v34-regression-failure.txt
            git commit -m "Record v34 regression failure"
            git push origin HEAD:privacy-security-hardening
            exit "$status"
          fi

      - name: Commit v34 and clean staging
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/v34-patch .github/workflows/apply-v34-coaching.yml .github/workflows/apply-v34-final-commit.yml .github/v34-final-commit.patch.b64 .github/v34-workflow-kick*.txt .github/v34-regression-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply v34 coaching architecture refinement"
          git push origin HEAD:privacy-security-hardening
