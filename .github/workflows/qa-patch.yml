name: QA patch validation

on:
  push:
    branches:
      - agent/qa-openai-primary

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic production patch
        run: node scripts/apply_qa_patch.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run regression suite
        run: npm test
      - name: Syntax check production server
        run: node --check server.js
      - name: Commit generated production changes
        run: |
          if git diff --quiet -- server.js package.json; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "qa-bot"
          git config user.email "qa-bot@users.noreply.github.com"
          git add server.js package.json
          git commit -m "Apply OpenAI primary and validated adjustments"
          git push
