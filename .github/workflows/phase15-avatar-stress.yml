name: Phase 15 Multi Avatar Stress Test

on:
  push:
    paths:
      - '.github/phase15-avatar-stress-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  avatar-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify stress script syntax
        run: node --check .github/phase15-avatar-stress-test.mjs
      - name: Run two live avatar builds
        env:
          BASE_URL: https://raz-coaching-platform.onrender.com
        run: node .github/phase15-avatar-stress-test.mjs
      - name: Commit avatar stress results
        if: always()
        run: |
          git config user.name 'RAZ avatar QA bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main || true
          git add .github/phase15-avatar-stress-result.json .github/phase15-avatar-*-program.txt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Phase 15 multi-avatar stress result'
          git push
