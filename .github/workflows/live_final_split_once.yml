name: Split final live coaching acceptance

on:
  push:
    branches:
      - privacy-security-hardening

permissions:
  contents: read

jobs:
  live-final:
    strategy:
      fail-fast: false
      matrix:
        group: [A, B]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare group-specific acceptance script
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python - <<'PY'
          import os
          p='scripts/live_final_six_acceptance.mjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("const ambiguous={primary_goals:", "const ambiguous={experience:'advanced',primary_goals:", 1)
          s=s.replace("const marathon={primary_goals:['Improve marathon from 4:05 to 3:40'],secondary_goals:['Maintain basic strength and stay durable'],maintenance_goals:[],goal_priority_model:'tiered_equal_primary',experience:'intermediate',days_per_week:1,", "const marathon={primary_goals:['Improve marathon from 4:05 to 3:40'],secondary_goals:['Maintain basic strength and stay durable'],maintenance_goals:[],goal_priority_model:'tiered_equal_primary',experience:'intermediate',days_per_week:2,", 1)
          group=os.environ['GROUP']
          keep={'A':{'AVATAR3_WARRIOR','ANNOYING_CONCURRENT','RUNNER_5K'},'B':{'ROWER_2K','MARATHON','TRIATHLON_OLYMPIC'}}[group]
          lines=[]
          for line in s.splitlines():
              if line.startswith("results.push(await runCase('"):
                  name=line.split("results.push(await runCase('",1)[1].split("'",1)[0]
                  if name not in keep:
                      continue
              lines.append(line)
          open('scripts/live_final_group.mjs','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          print('group',group,'cases',sorted(keep))
          PY
      - name: Wait for Render deployment
        run: sleep 240
      - name: Run final live group
        run: node scripts/live_final_group.mjs
