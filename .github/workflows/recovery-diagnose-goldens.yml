name: Recovery Diagnose Goldens

on:
  push:
    paths:
      - '.github/workflows/recovery-diagnose-goldens.yml'
      - 'phase14/test/fixtures/advanced_hybrid_launch.js'
      - 'phase14/test/fixtures/golden_programs.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact Phase 15 runtime and print golden flag sets
        run: |
          cd phase14
          npm run phase15:build
          node --input-type=module <<'NODE'
          import { collectRepairableValidationFailures } from './engine/repairable_validation_bundle.js';
          import { ADVANCED_HYBRID_LAUNCH_INTAKE, advancedHybridLaunchProgram } from './test/fixtures/advanced_hybrid_launch.js';
          import { YOUTH_GYMNASTICS_INTAKE, youthGymnasticsGoldenProgram } from './test/fixtures/golden_programs.js';

          let week = 0;
          let changedRingDipRows = 0;
          const youthCandidate = youthGymnasticsGoldenProgram()
            .split('\n')
            .map((line) => {
              const wm = line.match(/^START_WEEK(\d+)_TSV$/);
              if (wm) week = Number(wm[1]);
              if (line.startsWith('Mon\t')) line = `Session A\t${line.slice(4)}`;
              else if (line.startsWith('Thu\t')) line = `Session B\t${line.slice(4)}`;

              const cells = line.split('\t');
              if (week === 3 && cells[1] === 'Controlled Handstand Kick-up' && cells[3] === '6') cells[3] = '5';
              if (/Ring Dip/i.test(cells[1] || '')) {
                const targetReps = {1:'3', 2:'4', 3:'4', 4:'4'}[week];
                if (targetReps && cells[4] !== targetReps) {
                  cells[4] = targetReps;
                  changedRingDipRows++;
                }
              }
              return cells.join('\t');
            })
            .join('\n');

          console.log(`DIAGNOSTIC_TRANSFORM ring_dip_rows_changed=${changedRingDipRows}`);
          for (const [name, program, intake] of [
            ['HYBRID', advancedHybridLaunchProgram(), ADVANCED_HYBRID_LAUNCH_INTAKE],
            ['YOUTH_LABELS_KICKUP_RINGDIP', youthCandidate, YOUTH_GYMNASTICS_INTAKE],
          ]) {
            const result = collectRepairableValidationFailures(program, intake);
            console.log(`=== ${name} RESULT ===`);
            console.log(JSON.stringify({
              ok: result.ok,
              flags: result.flags.map(({code, amendment, details}) => ({code, amendment, details})),
            }, null, 2));
          }
          NODE
