name: Recovery Diagnose Goldens

on:
  push:
    paths:
      - '.github/workflows/recovery-diagnose-goldens.yml'
      - 'phase14/test/fixtures/advanced_hybrid_launch.js'
      - 'phase14/test/fixtures/golden_programs.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact Phase 15 runtime and print golden flag sets
        run: |
          cd phase14
          npm run phase15:build
          node --input-type=module <<'NODE'
          import { collectRepairableValidationFailures } from './engine/repairable_validation_bundle.js';
          import { ADVANCED_HYBRID_LAUNCH_INTAKE, advancedHybridLaunchProgram } from './test/fixtures/advanced_hybrid_launch.js';
          import { YOUTH_GYMNASTICS_INTAKE, youthGymnasticsGoldenProgram } from './test/fixtures/golden_programs.js';

          const youthLabelsAndKickupCap = youthGymnasticsGoldenProgram()
            .split('\n')
            .map((line) => line.startsWith('Mon\t') ? `Session A\t${line.slice(4)}` : line.startsWith('Thu\t') ? `Session B\t${line.slice(4)}` : line)
            .join('\n')
            .replace('Session A\tControlled Handstand Kick-up\tBW\t6\t2 attempts', 'Session A\tControlled Handstand Kick-up\tBW\t5\t2 attempts')
            .replace('Session B\tControlled Handstand Kick-up\tBW\t6\t1-2 attempts', 'Session B\tControlled Handstand Kick-up\tBW\t5\t1-2 attempts');

          for (const [name, program, intake] of [
            ['HYBRID', advancedHybridLaunchProgram(), ADVANCED_HYBRID_LAUNCH_INTAKE],
            ['YOUTH_LABELS_PLUS_KICKUP_CAP', youthLabelsAndKickupCap, YOUTH_GYMNASTICS_INTAKE],
          ]) {
            const result = collectRepairableValidationFailures(program, intake);
            console.log(`=== ${name} RESULT ===`);
            console.log(JSON.stringify({
              ok: result.ok,
              flags: result.flags.map(({code, amendment, details}) => ({code, amendment, details})),
            }, null, 2));
          }
          NODE
