name: Patch Final Convergence v21

on:
  push:
    branches: [privacy-security-hardening]
    paths:
      - '.github/workflows/patch-final-convergence-v21.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire Tactical weighted pull and final-boundary convergence
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('phase14/engine/repairable_validation_bundle.js')
          s=p.read_text()

          imp="import { normalizeTacticalGppFloor } from './tactical_gpp_normalizer.js';"
          newimp=imp+"\nimport { normalizeTacticalWeightedPullExposure } from './tactical_weighted_pull_normalizer.js';"
          if "normalizeTacticalWeightedPullExposure" not in s:
              if s.count(imp)!=1: raise SystemExit(f'import anchor count={s.count(imp)}')
              s=s.replace(imp,newimp)

          anchor="  const tacticalGpp = normalizeTacticalGppFloor(candidate, intake);\n  candidate = tacticalGpp.program;\n  if (tacticalGpp.repaired) repairs.push({ type: 'tactical_gpp_floor', rows: tacticalGpp.repairs });"
          insert="  const tacticalWeightedPull = normalizeTacticalWeightedPullExposure(candidate, intake);\n  candidate = tacticalWeightedPull.program;\n  if (tacticalWeightedPull.repaired) repairs.push({ type: 'tactical_weighted_pull', rows: tacticalWeightedPull.repairs });\n\n"+anchor
          if "type: 'tactical_weighted_pull'" not in s:
              if s.count(anchor)!=1: raise SystemExit(f'tactical anchor count={s.count(anchor)}')
              s=s.replace(anchor,insert)

          old="  candidate = reformatWarmupCells(candidate);\n  candidate = repairPhase15Program(candidate);\n  runRepairable(flags, () => validatePhase15FinalProgram(candidate, intake));"
          new="  candidate = reformatWarmupCells(candidate);\n  candidate = repairPhase15Program(candidate);\n\n  // Final-boundary convergence: legacy formatting/repair must never be able to\n  // reintroduce a defect after the deterministic candidate layer has already\n  // fixed it. Re-apply only narrow, idempotent repairs here, then re-run the\n  // affected semantic gates before the final release validator.\n  const finalAdvancedOap = normalizeAdvancedHybridWeek4OapConsolidation(candidate, intake);\n  candidate = finalAdvancedOap.program;\n  if (finalAdvancedOap.repaired) deterministic_repairs.push({ type: 'final_advanced_hybrid_week4_oap_consolidation', rows: finalAdvancedOap.repairs });\n\n  const finalAdvancedOhp = normalizeAdvancedHybridOHPComplement(candidate, intake);\n  candidate = finalAdvancedOhp.program;\n  if (finalAdvancedOhp.repaired) deterministic_repairs.push({ type: 'final_advanced_hybrid_ohp_complement', rows: finalAdvancedOhp.repairs });\n\n  const finalTacticalPull = normalizeTacticalWeightedPullExposure(candidate, intake);\n  candidate = finalTacticalPull.program;\n  if (finalTacticalPull.repaired) deterministic_repairs.push({ type: 'final_tactical_weighted_pull', rows: finalTacticalPull.repairs });\n\n  const finalModel = parseProgramModel(candidate, intake);\n  runRepairable(flags, () => validateAdvancedHybridManualAcceptanceSemantic(candidate, intake, finalModel));\n  runRepairable(flags, () => validateTacticalScheduleArchitectureSemantic(candidate, intake, finalModel));\n  runRepairable(flags, () => validateKnownMaxPullUpDoseSemantic(candidate, intake, finalModel));\n  runRepairable(flags, () => validatePhase15FinalProgram(candidate, intake));"
          if "final_tactical_weighted_pull" not in s:
              if s.count(old)!=1: raise SystemExit(f'final boundary anchor count={s.count(old)}')
              s=s.replace(old,new)

          p.write_text(s)
          PY
          grep -q "normalizeTacticalWeightedPullExposure" phase14/engine/repairable_validation_bundle.js
          grep -q "final_advanced_hybrid_week4_oap_consolidation" phase14/engine/repairable_validation_bundle.js
          grep -q "final_tactical_weighted_pull" phase14/engine/repairable_validation_bundle.js
      - name: Run focused convergence tests
        working-directory: phase14
        run: |
          node --test test/tactical_weighted_pull_normalizer.test.js
          node --test test/advanced_hybrid_oap_consolidation_normalizer.test.js
          node --test test/advanced_hybrid_ohp_normalizer.test.js
      - name: Commit wired source
        run: |
          git config user.name 'RAZ QA patch bot'
          git config user.email 'actions@users.noreply.github.com'
          git add phase14/engine/repairable_validation_bundle.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire final-boundary Advanced and Tactical convergence'
          git push origin HEAD:privacy-security-hardening

