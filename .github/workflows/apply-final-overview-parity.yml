name: Apply final Overview spreadsheet parity

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-final-overview-parity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved Overview body-fill parity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phase14/public/spreadsheet-parity.js')
          s=p.read_text()
          old_detail="      font(b,{size:10}); align(b); ws.mergeCells(row,2,row,4); ws.getRow(row).height=34; row++;"
          new_detail="      ws.mergeCells(row,2,row,4); fill(b,BODY); font(b,{size:10}); align(b); ws.getRow(row).height=34; row++;"
          if old_detail in s:
              s=s.replace(old_detail,new_detail,1)
          elif new_detail not in s:
              raise SystemExit('Overview detail parity anchor not found')

          old_rules="      ws.mergeCells(row,1,row,4); const c=ws.getRow(row).getCell(1); c.value='• '+rule; font(c,{size:10}); align(c); ws.getRow(row).height=32; row++;"
          new_rules="      ws.mergeCells(row,1,row,4); const c=ws.getRow(row).getCell(1); c.value='• '+rule; fill(c,BODY); font(c,{size:10}); align(c); ws.getRow(row).height=32; row++;"
          if old_rules in s:
              s=s.replace(old_rules,new_rules,1)
          elif new_rules not in s:
              raise SystemExit('Overview program-rules parity anchor not found')
          p.write_text(s)
          PY
      - name: Syntax check exporter
        working-directory: phase14
        run: node --check public/spreadsheet-parity.js
      - name: Commit production exporter parity fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase14/public/spreadsheet-parity.js
          git commit -m 'Finish approved Overview fill parity [skip ci]' || exit 0
          git push origin HEAD:privacy-security-hardening
