name: Patch Final Boundary Convergence

on:
  push:
    branches: [privacy-security-hardening]
    paths:
      - '.github/workflows/patch-final-boundary-convergence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire final-boundary deterministic convergence
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('phase14/engine/repairable_validation_bundle.js')
          s=p.read_text()

          import_anchor="import { normalizeTacticalGppFloor } from './tactical_gpp_normalizer.js';"
          import_line="import { normalizeTacticalWeightedPullExposure } from './tactical_weighted_pull_normalizer.js';"
          if import_line not in s:
              if s.count(import_anchor)!=1: raise SystemExit(f'import anchor count={s.count(import_anchor)}')
              s=s.replace(import_anchor, import_anchor+'\n'+import_line)

          gpp_anchor="  const tacticalGpp = normalizeTacticalGppFloor(candidate, intake);\n  candidate = tacticalGpp.program;\n  if (tacticalGpp.repaired) repairs.push({ type: 'tactical_gpp_floor', rows: tacticalGpp.repairs });\n"
          weighted_block=gpp_anchor+"\n  const tacticalWeightedPull = normalizeTacticalWeightedPullExposure(candidate, intake);\n  candidate = tacticalWeightedPull.program;\n  if (tacticalWeightedPull.repaired) repairs.push({ type: 'tactical_weighted_pull', rows: tacticalWeightedPull.repairs });\n"
          if "type: 'tactical_weighted_pull'" not in s:
              if s.count(gpp_anchor)!=1: raise SystemExit(f'gpp anchor count={s.count(gpp_anchor)}')
              s=s.replace(gpp_anchor, weighted_block)

          final_anchor="  candidate = reformatWarmupCells(candidate);\n  candidate = repairPhase15Program(candidate);\n  runRepairable(flags, () => validatePhase15FinalProgram(candidate, intake));"
          final_block="""  candidate = reformatWarmupCells(candidate);
  candidate = repairPhase15Program(candidate);

  // FINAL-BOUNDARY-CONVERGENCE: late formatting/legacy repair is allowed to
  // rearrange presentation, but it must not reintroduce two already-defined
  // coaching defects. Re-run only safe/idempotent source-authored normalizers
  // immediately before final QA, then dictionary-check their canonical output.
  const finalAdvancedOap = normalizeAdvancedHybridWeek4OapConsolidation(candidate, intake);
  candidate = finalAdvancedOap.program;
  if (finalAdvancedOap.repaired) deterministic_repairs.push({ type: 'final_advanced_hybrid_week4_oap_consolidation', rows: finalAdvancedOap.repairs });

  const finalTacticalWeightedPull = normalizeTacticalWeightedPullExposure(candidate, intake);
  candidate = finalTacticalWeightedPull.program;
  if (finalTacticalWeightedPull.repaired) deterministic_repairs.push({ type: 'final_tactical_weighted_pull', rows: finalTacticalWeightedPull.repairs });

  const finalDictionary = runRepairable(flags, () => validateExercisesAgainstDictionary(candidate, intake));
  if (finalDictionary.ok) candidate = finalDictionary.value.program;

  runRepairable(flags, () => validatePhase15FinalProgram(candidate, intake));"""
          if 'FINAL-BOUNDARY-CONVERGENCE' not in s:
              if s.count(final_anchor)!=1: raise SystemExit(f'final anchor count={s.count(final_anchor)}')
              s=s.replace(final_anchor, final_block)

          p.write_text(s)
          PY
          grep -q "normalizeTacticalWeightedPullExposure" phase14/engine/repairable_validation_bundle.js
          grep -q "FINAL-BOUNDARY-CONVERGENCE" phase14/engine/repairable_validation_bundle.js
      - name: Run focused convergence tests
        working-directory: phase14
        run: |
          node --test test/tactical_weighted_pull_normalizer.test.js
          node --test test/advanced_hybrid_oap_consolidation_normalizer.test.js
      - name: Commit wired production source
        run: |
          git config user.name 'RAZ QA patch bot'
          git config user.email 'actions@users.noreply.github.com'
          git add phase14/engine/repairable_validation_bundle.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire final-boundary Advanced Tactical convergence'
          git push origin HEAD:privacy-security-hardening
