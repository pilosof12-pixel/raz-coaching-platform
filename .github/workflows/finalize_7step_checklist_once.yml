name: Finalize seven-step coaching checklist

on:
  push:
    branches:
      - privacy-security-hardening
    paths:
      - qa/finalize-7step-checklist-trigger.txt

permissions:
  contents: write

jobs:
  finalize-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finalize_7step_checklist.mjs
      - name: Commit reconciled checklist
        run: |
          git config user.name 'RAZ regression bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/LAUNCH_CHECKLIST_2026-08-10.md
          git commit -m 'Mark seven-step coaching integration complete'
          git push origin HEAD:privacy-security-hardening
