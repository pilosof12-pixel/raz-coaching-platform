name: Semantic production QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Root semantic regression
        run: node --test phase14/test/program_model_semantics.test.js
      - name: Build the real Phase 14 production pipeline
        run: |
          cd phase14
          npm install
          npm run phase15:build
          node --check server.phase15.js
      - name: Focused Hybrid Tactical Youth convergence QA
        run: |
          cd phase14
          node --test \
            test/youth_v32_progression_convergence.test.js \
            test/coaching_consolidation_quality.test.js \
            test/live_v30m_convergence_regressions.test.js
