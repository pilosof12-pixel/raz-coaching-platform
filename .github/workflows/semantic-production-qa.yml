name: Semantic production QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reproduce hybrid strength-day semantics
        run: node --test phase14/test/program_model_semantics.test.js
