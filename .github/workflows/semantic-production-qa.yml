name: Semantic production QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Root semantic regression
        run: node --test phase14/test/program_model_semantics.test.js
      - name: Phase 14 focused Youth convergence QA
        run: |
          cd phase14
          npm install
          npm test
      - name: Phase 14 production build and full checks
        run: |
          cd phase14
          npm run check
