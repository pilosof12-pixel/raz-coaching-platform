name: Fetch Live Tactical Failure Summaries

on:
  push:
    paths:
      - '.github/workflows/fetch-live-tactical-failures.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact failed Tactical jobs
        env:
          BASE_URL: https://raz-coaching-platform.onrender.com
          JOB_LATEST: e05cf719a8a99598371900a383867ee6
          JOB_SCREENSHOT: 25d1ad0ab9acdf10e5ca696173d20e90
        run: |
          mkdir -p docs/qa/live-tactical
          node <<'NODE'
          const fs = require('fs');
          const base = process.env.BASE_URL;
          const jobs = [
            {label:'latest_typed', id:process.env.JOB_LATEST},
            {label:'screenshot', id:process.env.JOB_SCREENSHOT},
          ];
          (async()=>{
            const out=[];
            for (const job of jobs) {
              const r = await fetch(base + '/api/job/' + encodeURIComponent(job.id), {headers:{accept:'application/json'}});
              const text = await r.text();
              let data={}; try{data=JSON.parse(text)}catch{}
              out.push({
                label:job.label,
                http_status:r.status,
                status:data.status||null,
                stage:data.stage||null,
                attempt:data.attempt||null,
                detail:data.detail||null,
                error:data.error||null,
                has_program:typeof data.program==='string' && data.program.length>0,
                program_chars:typeof data.program==='string'?data.program.length:0,
              });
            }
            fs.writeFileSync('docs/qa/live-tactical/failures.json',JSON.stringify(out,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit sanitized failure summaries
        run: |
          git config user.name 'RAZ live QA bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin privacy-security-hardening || true
          git add docs/qa/live-tactical/failures.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Tactical live failure summaries'
          git push origin HEAD:privacy-security-hardening
