name: Raise OpenAI live-generation timeouts

on:
  push:
    branches:
      - privacy-security-hardening
    paths:
      - '.github/workflows/raise-openai-timeouts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Raise provider and build timeouts for high reasoning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phase14/scripts/build_phase15_runtime.mjs')
          s=p.read_text()
          old='const AI_REQUEST_TIMEOUT_MS = Number(process.env.AI_REQUEST_TIMEOUT_MS || (OPENAI_API_KEY ? 180000 : 110000));\\nconst BUILD_JOB_TIMEOUT_MS = Number(process.env.BUILD_JOB_TIMEOUT_MS || (OPENAI_API_KEY ? 360000 : 210000));'
          new='const AI_REQUEST_TIMEOUT_MS = Number(process.env.AI_REQUEST_TIMEOUT_MS || (OPENAI_API_KEY ? 420000 : 110000));\\nconst BUILD_JOB_TIMEOUT_MS = Number(process.env.BUILD_JOB_TIMEOUT_MS || (OPENAI_API_KEY ? 600000 : 210000));'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('timeout anchor not found')
          p.write_text(s)
          PY
          node --check phase14/scripts/build_phase15_runtime.mjs
      - name: Commit durable timeout fix and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase14/scripts/build_phase15_runtime.mjs
          git rm .github/workflows/raise-openai-timeouts.yml
          git commit -m 'Allow high-reasoning OpenAI generation to finish [skip ci]'
          git push origin HEAD:privacy-security-hardening
