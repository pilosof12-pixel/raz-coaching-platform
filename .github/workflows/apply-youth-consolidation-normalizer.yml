name: Wire Youth consolidation normalizer

on:
  push:
    paths:
      - '.github/workflows/apply-youth-consolidation-normalizer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire normalizer into shared production bundle
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('phase14/engine/repairable_validation_bundle.js')
          s = p.read_text()
          import_anchor = "import { normalizeYouthAcquisitionGoalFloors } from './youth_goal_floor_normalizer.js';"
          import_line = "import { normalizeYouthWeek4Consolidation } from './youth_consolidation_normalizer.js';"
          if import_line not in s:
              if s.count(import_anchor) != 1:
                  raise SystemExit(f'import anchor count={s.count(import_anchor)}')
              s = s.replace(import_anchor, import_anchor + '\n' + import_line)
          order_anchor = "  if (youthOrder.reordered) repairs.push({ type: 'youth_primary_skill_order', moves: youthOrder.moves });"
          consolidation = "\n\n  const youthConsolidation = normalizeYouthWeek4Consolidation(candidate, intake);\n  candidate = youthConsolidation.program;\n  if (youthConsolidation.repaired) repairs.push({ type: 'youth_week4_consolidation', rows: youthConsolidation.repairs });"
          if "type: 'youth_week4_consolidation'" not in s:
              if s.count(order_anchor) != 1:
                  raise SystemExit(f'order anchor count={s.count(order_anchor)}')
              s = s.replace(order_anchor, order_anchor + consolidation)
          p.write_text(s)
          PY
      - name: Run focused Youth consolidation regressions
        id: tests
        working-directory: phase14
        shell: bash
        run: |
          set +e
          node --test test/youth_consolidation_normalizer.test.js test/coaching_consolidation_quality.test.js > "$RUNNER_TEMP/youth-consolidation.log" 2>&1
          STATUS=$?
          cat "$RUNNER_TEMP/youth-consolidation.log"
          exit "$STATUS"
      - name: Upload focused test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youth-consolidation-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/youth-consolidation.log
          retention-days: 2
      - name: Commit wiring
        if: steps.tests.outcome == 'success'
        run: |
          git config user.name 'RAZ convergence bot'
          git config user.email 'actions@users.noreply.github.com'
          git add phase14/engine/repairable_validation_bundle.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire deterministic Youth Week 4 consolidation repair'
          git push origin HEAD:privacy-security-hardening
