name: Apply Youth v31 visible progression convergence

on:
  push:
    branches: [privacy-security-hardening]
    paths:
      - 'patches/youth-v31-progression-convergence.patch'

permissions:
  contents: write

jobs:
  patch-qa-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-security-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: |
          git apply --check patches/youth-v31-progression-convergence.patch
          git apply patches/youth-v31-progression-convergence.patch
      - name: Install dependencies
        run: npm ci
      - name: Run focused convergence QA
        run: node --test phase14/test/live_v30m_convergence_regressions.test.js
      - name: Run repository regression QA
        run: npm test
      - name: Build and syntax-check Phase 15 runtime
        run: |
          node --check phase14/engine/coaching_spec_v1_convergence_normalizer.js
          node phase14/scripts/build_phase15_runtime.mjs
          node --check phase14/server.phase15.js
      - name: Bump runtime and commit only after QA passes
        run: |
          printf '%s\n' 'launch-acceptance-v32-youth-progression-convergence-v1-20260819' > phase14/public/runtime-version.txt
          git config user.name 'RAZ QA bot'
          git config user.email 'actions@users.noreply.github.com'
          git add phase14/engine/coaching_spec_v1_convergence_normalizer.js \
                  phase14/test/live_v30m_convergence_regressions.test.js \
                  phase14/public/runtime-version.txt \
                  phase14/server.phase15.js
          git commit -m '[RUN-LIVE-ACCEPTANCE] Apply v32 Youth progression convergence'
          git push origin HEAD:privacy-security-hardening
