name: Regression tests

on:
  push:
    branches:
      - main
      - agent/lastmile-run
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply pending last-mile source patch
        run: node scripts/apply_lastmile_clean.mjs
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - name: Validate Phase 15 generated runtime
        run: |
          node --check phase14/server.js
          node --check phase14/scripts/build_phase15_runtime.mjs
          node phase14/scripts/build_phase15_runtime.mjs
          node --check phase14/server.phase15.js
          node --check phase14/engine/phase15_program_qa.js
          node --check phase14/engine/phase15_final_qa.js
          node --test phase14/test/phase15_planner_regression.test.mjs
          node --test phase14/test/phase15_specialist_rules.test.mjs
          grep -q 'deterministic-skeleton-v5.2.6-warrior-certified' phase14/server.phase15.js
          grep -q 'WARRIOR / ATHLETIC HYPERTROPHY RULE' phase14/server.phase15.js
          grep -q 'explicitNoBox' phase14/server.js
          grep -q 'Ground-based unilateral leg work' phase14/server.js
          grep -q 'Maximum-quality short sprint' phase14/server.js
          grep -q "cells\[1\] = 'Chin-up'" phase14/server.js
          grep -q 'PARK-ONLY HARD STOP' phase14/server.phase15.js
          grep -q 'CALENDAR HARD STOP' phase14/server.phase15.js
          grep -q 'Maximum-quality horizontal jump' phase14/server.js
          grep -q 'availableDays.length === requestedDays' phase14/server.js
          grep -q 'WEIGHTED CALISTHENICS BENCHMARK ANCHOR' phase14/server.phase15.js
          grep -q 'phase15LastMileTsv' phase14/server.phase15.js
          grep -q 'UNRESOLVED_CLIENT_REVIEW' phase14/server.phase15.js
          grep -q 'RPE-selected load' phase14/server.phase15.js
          grep -q '0-set or 0-rep explanatory placeholder row' phase14/server.phase15.js
      - name: Commit tested production patch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'RAZ regression bot'
          git config user.email 'actions@users.noreply.github.com'
          git add phase14/server.js phase14/scripts/build_phase15_runtime.mjs
          if git diff --cached --quiet; then echo 'No source patch to commit'; exit 0; fi
          git commit -m 'Apply Warrior v5.2.6 certification runtime'
          git push origin HEAD:${TARGET_BRANCH}
