name: Regression tests

on:
  push:
    branches:
      - main
      - agent/lastmile-run
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply pending last-mile source patch
        run: node scripts/apply_lastmile_clean.mjs
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - name: Validate root launch reference layer
        run: |
          node --check server_secure.js
          node --check entitlements.js
          node --check analytics.js
          node --check public/privacy-controls.js
          node --check public/analytics-client.js
      - name: Validate deployed Phase 15 runtime and launch layer
        run: |
          node --check phase14/server.js
          node --check phase14/scripts/build_phase15_runtime.mjs
          node --check phase14/scripts/apply_launch_runtime.mjs
          node --check phase14/engine/phase15_source_router.js
          node --check phase14/engine/phase15_program_qa.js
          node --test phase14/test/phase15_source_grounding.test.mjs
          node --test phase14/test/phase15_goal_specificity.test.mjs
          node phase14/scripts/build_phase15_runtime.mjs
          node phase14/scripts/apply_launch_runtime.mjs
          node --check phase14/server.phase15.js
          node --check phase14/server_secure.js
          node --check phase14/entitlements.js
          node --check phase14/analytics.js
          node --check phase14/privacy_store.js
          node --check phase14/intake_validation.js
          node --check phase14/public/launch-controls.js
          node --test phase14/test/launch_security_privacy.test.js
          node --test phase14/test/phase15_planner_regression.test.mjs
          node --test phase14/test/phase15_specialist_rules.test.mjs
          grep -q 'deterministic-skeleton-v5.2.10-source-grounded' phase14/server.phase15.js
          grep -q 'SOURCE-GROUNDING HARD CONTRACT' phase14/server.phase15.js
          grep -q 'EXERCISE CLOSED SET' phase14/server.phase15.js
          grep -q 'CURATED COACHING SOURCE EXCERPTS' phase14/server.phase15.js
          grep -q 'CANONICAL EXERCISE CATALOG' phase14/server.phase15.js
          grep -q 'buildPhase15SourceGrounding(ENGINE, intake, EXERCISE_DICTIONARY)' phase14/server.phase15.js
          grep -q 'WARRIOR / ATHLETIC HYPERTROPHY RULE' phase14/server.phase15.js
          grep -q 'PARK-ONLY HARD STOP' phase14/server.phase15.js
          grep -q 'CALENDAR HARD STOP' phase14/server.phase15.js
          grep -q 'UNRESOLVED_CLIENT_REVIEW' phase14/server.phase15.js
          grep -q 'SPORT_MODALITY_SPECIFICITY_MISSING' phase14/engine/phase15_program_qa.js
          grep -q 'launch-controls.js' phase14/public/index.html
          grep -q 'launch-mobile.css' phase14/public/index.html
          grep -q 'invalidateCoachingDataCache' phase14/storage.js
          grep -q 'invalidateCoachingDataCache' phase14/privacy_store.js
      - name: One-off live specificity verification
        run: |
          echo "Waiting for Render auto-deploy..."
          sleep 100
          node <<'NODE'
          const BASE='https://raz-coaching-platform.onrender.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(path,options={}){const res=await fetch(BASE+path,options);const text=await res.text();let body=null;try{body=text?JSON.parse(text):null}catch{body={raw:text}}return{res,body};}
          async function poll(id){const started=Date.now();while(Date.now()-started<300000){const x=await req('/api/job/'+id);if(x.body?.status==='done')return x.body;if(x.body?.status==='error')throw new Error(x.body.error||'build failed');await sleep(4000);}throw new Error('build timeout');}
          const intake={
            primary_goals:['Back squat 200 kg','Weighted chin-up +70 kg for 3 reps'],
            secondary_goals:['Improve 5 km from 25:00 to 22:30'],
            maintenance_goals:[],goal_priority_model:'tiered_equal_primary',experience:'advanced',days_per_week:4,
            gym_availability_mode:'flexible',available_gym_days:[],same_day_gap_hours:6,session_length:'60 minutes',bodyweight:'84 kg',
            equipment:'Full commercial gym — all standard barbells, dumbbells, racks, machines, cables and bodyweight stations available.',training_location:'commercial_gym',language:'en',
            split_preference:'No preference. Keep no more than two genuinely hard lower-body sessions per week.',
            current_numbers:'Back squat: 170 kg x 3\nWeighted chin-up: +55 kg x 3\nRDL: 190 kg x 5\nOHP: 70 kg x 5\n5 km: 25:00',
            performance_markers:['Back squat: 170 kg x 3','Weighted chin-up: +55 kg x 3','RDL: 190 kg x 5','OHP: 70 kg x 5','5 km: 25:00'],
            injuries:'Mild recurring low-back irritation after high-volume deep squatting; controlled box squats and RDLs are currently tolerated.',
            pain:{active:true,description:'Mild recurring low-back irritation after high-volume deep squatting',severity:'mild',character:'ache/tightness',next_day_baseline:'usually back to baseline',tolerated_movements:'controlled box squats, RDLs, split squats'},
            mobility:{active:false,limitation:''},sport:'MMA / BJJ',
            sport_schedule:[{day:'Mon',intensity:'hard',gap_hours:6},{day:'Wed',intensity:'moderate',gap_hours:6},{day:'Fri',intensity:'hard',gap_hours:6},{day:'Sat',intensity:'moderate',gap_hours:6}],
            sleep_hours:'6.5',recovery_rating:'average / variable',notes:'Avoid hard conditioning within 24 hours before hard MMA. Keep sessions at or under 60 minutes.',
            privacy_consent:{health_data:true,policy_version:'2026-08-11',consented_at:new Date().toISOString()}
          };
          const cfg=await req('/api/program-pass-config');if(cfg.body?.enforced!==false)throw new Error('Program Pass enforcement must remain off');
          const build=await req('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({intake})});
          console.log('LIVE SPEC build',build.res.status,JSON.stringify(build.body));
          if(build.res.status!==202||!build.body?.job_id||!build.body?.token)throw new Error('build not accepted');
          const token=build.body.token;
          try{
            const done=await poll(build.body.job_id);const program=String(done.program||'');
            const week1=program.match(/START_WEEK1_TSV[\s\S]*?END_WEEK1_TSV/)?.[0]||'';
            console.log('\n===== LIVE SPEC WEEK1 =====\n'+week1+'\n===== END LIVE SPEC WEEK1 =====');
            const rows=week1.split('\n').filter(x=>x.includes('\t')&&!/^Day\t/i.test(x));
            const directRun=rows.some(line=>{const cells=line.split('\t');const ex=String(cells[1]||'');const notes=String(cells[7]||'');return !/^\s*\[WARMUP\]/i.test(ex)&&/\b(run|running|jog|jogging|treadmill|sprint)\b/i.test(ex+' '+notes);});
            const marker=Number((program.match(/QA_FORMULA_VIOLATION_COUNT:\s*(\d+)/)||[])[1]||0);
            console.log('LIVE SPEC direct_running='+directRun+' formula_marker='+marker);
            if(!directRun)throw new Error('SPECIFICITY FAILURE: 5K goal has no direct running exposure');
            if(marker>0)throw new Error('FORMULA QA still reports '+marker+' violation(s)');
            console.log('LIVE_SPECIFICITY_RESULT=PASS');
          } finally {
            await req('/api/client-data',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}).catch(()=>{});
          }
          NODE
      - name: Commit tested production patch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'RAZ regression bot'
          git config user.email 'actions@users.noreply.github.com'
          git add phase14/server.js phase14/scripts/build_phase15_runtime.mjs phase14/engine/phase15_program_qa.js
          if git diff --cached --quiet; then echo 'No source patch to commit'; exit 0; fi
          git commit -m 'Apply Phase 15 specificity and QA hardening'
          git push origin HEAD:${TARGET_BRANCH}
