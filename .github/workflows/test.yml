name: Regression tests

on:
  push:
    branches:
      - main
      - agent/lastmile-run
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply pending last-mile source patch
        run: node scripts/apply_lastmile_clean.mjs
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - name: Validate root launch reference layer
        run: |
          node --check server_secure.js
          node --check entitlements.js
          node --check analytics.js
          node --check public/privacy-controls.js
          node --check public/analytics-client.js
      - name: Validate deployed Phase 15 runtime and launch layer
        run: |
          node --check phase14/server.js
          node --check phase14/scripts/build_phase15_runtime.mjs
          node --check phase14/scripts/apply_launch_runtime.mjs
          node --check phase14/engine/phase15_source_router.js
          node --test phase14/test/phase15_source_grounding.test.mjs
          node phase14/scripts/build_phase15_runtime.mjs
          node phase14/scripts/apply_launch_runtime.mjs
          node --check phase14/server.phase15.js
          node --check phase14/server_secure.js
          node --check phase14/entitlements.js
          node --check phase14/analytics.js
          node --check phase14/privacy_store.js
          node --check phase14/intake_validation.js
          node --check phase14/public/launch-controls.js
          node --test phase14/test/launch_security_privacy.test.js
          node --test phase14/test/phase15_planner_regression.test.mjs
          node --test phase14/test/phase15_specialist_rules.test.mjs
          grep -q 'deterministic-skeleton-v5.2.10-source-grounded' phase14/server.phase15.js
          grep -q 'SOURCE-GROUNDING HARD CONTRACT' phase14/server.phase15.js
          grep -q 'EXERCISE CLOSED SET' phase14/server.phase15.js
          grep -q 'CURATED COACHING SOURCE EXCERPTS' phase14/server.phase15.js
          grep -q 'CANONICAL EXERCISE CATALOG' phase14/server.phase15.js
          grep -q 'buildPhase15SourceGrounding(ENGINE, intake, EXERCISE_DICTIONARY)' phase14/server.phase15.js
          grep -q 'WARRIOR / ATHLETIC HYPERTROPHY RULE' phase14/server.phase15.js
          grep -q 'PARK-ONLY HARD STOP' phase14/server.phase15.js
          grep -q 'CALENDAR HARD STOP' phase14/server.phase15.js
          grep -q 'UNRESOLVED_CLIENT_REVIEW' phase14/server.phase15.js
          grep -q 'launch-controls.js' phase14/public/index.html
          grep -q 'launch-mobile.css' phase14/public/index.html
          grep -q 'invalidateCoachingDataCache' phase14/storage.js
          grep -q 'invalidateCoachingDataCache' phase14/privacy_store.js
      - name: One-off live privacy deletion verification
        run: |
          echo "Waiting for Render auto-deploy of the cache-invalidation fix..."
          sleep 90
          node <<'NODE'
          const BASE='https://raz-coaching-platform.onrender.com';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(path,options={}){const res=await fetch(BASE+path,options);const text=await res.text();let body=null;try{body=text?JSON.parse(text):null}catch{body={raw:text}}return{res,body};}
          async function poll(id){const started=Date.now();while(Date.now()-started<300000){const x=await req('/api/job/'+id);if(x.body?.status==='done')return x.body;if(x.body?.status==='error')throw new Error(x.body.error||'build failed');await sleep(4000);}throw new Error('build timeout');}
          const intake={
            primary_goals:['Back squat 200 kg'],secondary_goals:[],maintenance_goals:[],goal_priority_model:'tiered_equal_primary',experience:'advanced',days_per_week:3,gym_availability_mode:'flexible',available_gym_days:[],same_day_gap_hours:null,session_length:'60 minutes',bodyweight:'84 kg',equipment:'Full commercial gym — all standard barbells, dumbbells, racks, machines, cables and bodyweight stations available.',training_location:'commercial_gym',language:'en',split_preference:'No preference',current_numbers:'Back squat: 170 kg x 3',performance_markers:['Back squat: 170 kg x 3'],injuries:'None reported',pain:{active:false,description:'',severity:'',character:'',next_day_baseline:'',tolerated_movements:''},mobility:{active:false,limitation:''},sport:'',sport_schedule:[],sleep_hours:'7',recovery_rating:'average',notes:'Live privacy deletion verification.',privacy_consent:{health_data:true,policy_version:'2026-08-11',consented_at:new Date().toISOString()}
          };
          const cfg=await req('/api/program-pass-config');console.log('DELETE VERIFY config',cfg.res.status,JSON.stringify(cfg.body));if(cfg.body?.enforced!==false)throw new Error('Program Pass enforcement must remain off for this verification');
          const build=await req('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({intake})});console.log('DELETE VERIFY build',build.res.status,JSON.stringify(build.body));if(build.res.status!==202||!build.body?.job_id||!build.body?.token)throw new Error('build not accepted');
          const token=build.body.token;
          try{
            const done=await poll(build.body.job_id);if(!done.program)throw new Error('build returned no program');console.log('DELETE VERIFY built program_len='+done.program.length);
            const before=await req('/api/program/'+token);console.log('DELETE VERIFY before',before.res.status);if(before.res.status!==200||!before.body?.program)throw new Error('program not retrievable before delete');
            const del=await req('/api/client-data',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});console.log('DELETE VERIFY delete',del.res.status,JSON.stringify(del.body));if(del.res.status!==200||del.body?.ok!==true)throw new Error('delete endpoint failed');
            const after=await req('/api/program/'+token);console.log('DELETE VERIFY after',after.res.status,JSON.stringify(after.body));if(after.res.status===200)throw new Error('PRIVACY FAILURE: deleted coaching data is still retrievable');
            console.log('LIVE_PRIVACY_DELETE_RESULT=PASS');
          }catch(e){try{await req('/api/client-data',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})})}catch{}throw e;}
          NODE
      - name: Commit tested production patch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'RAZ regression bot'
          git config user.email 'actions@users.noreply.github.com'
          git add phase14/server.js phase14/scripts/build_phase15_runtime.mjs
          if git diff --cached --quiet; then echo 'No source patch to commit'; exit 0; fi
          git commit -m 'Apply source-grounded Phase 15 v5.2.10 runtime'
          git push origin HEAD:${TARGET_BRANCH}
