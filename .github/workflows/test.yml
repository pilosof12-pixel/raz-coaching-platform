name: Regression tests

on:
  push:
    branches:
      - main
      - agent/lastmile-run
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply pending last-mile source patch
        if: github.event_name == 'push'
        run: node scripts/apply_lastmile_clean.mjs
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - name: Validate Phase 15 generated runtime
        run: |
          node --check phase14/server.js
          node --check phase14/scripts/build_phase15_runtime.mjs
          node phase14/scripts/build_phase15_runtime.mjs
          node --check phase14/server.phase15.js
          node --check phase14/engine/phase15_program_qa.js
          node --check phase14/engine/phase15_final_qa.js
          node --test phase14/test/phase15_planner_regression.test.mjs
          node --test phase14/test/phase15_specialist_rules.test.mjs
          if [ "${{ github.event_name }}" = "push" ]; then
            grep -q 'deterministic-skeleton-v5.1-client-clean' phase14/server.phase15.js
            grep -q 'phase15LastMileTsv' phase14/server.phase15.js
            grep -q 'UNRESOLVED_CLIENT_REVIEW' phase14/server.phase15.js
          fi
          grep -q 'RPE-selected load' phase14/server.phase15.js
          grep -q 'Pseudo Planche Push-up' phase14/server.phase15.js
          grep -q '0-set or 0-rep explanatory placeholder row' phase14/server.phase15.js
      - name: Commit last-mile production patch
        if: github.event_name == 'push'
        run: |
          git config user.name 'RAZ regression bot'
          git config user.email 'actions@users.noreply.github.com'
          git add phase14/server.js phase14/scripts/build_phase15_runtime.mjs
          if git diff --cached --quiet; then echo 'No source patch to commit'; exit 0; fi
          git commit -m 'Add fail-closed last-mile client QA'
          git push origin HEAD:${GITHUB_REF_NAME}
